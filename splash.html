<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ITECH-STORE Splash</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="splash.css" />
  </head>
  <body>
    <main class="splash-screen">
      <div class="device-frame">
        <div class="scene">
          <div class="hero-card">
            <div class="image-cluster">
              <div class="hero-center">
                <div class="logo-card">
                  <div class="logo-inner">I</div>
                </div>
                <p class="welcome">Welcome to</p>
                <h1 class="brand">ITECH-STORE</h1>
                <p class="subtitle">Premium Gadgets &amp; Accessories</p>
              </div>
            </div>
          </div>

          <p class="tagline">Shop Smart. <span>Live Better.</span></p>

          <button class="cta">
            <svg class="rocket" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden>
              <path d="M2 22s4-1 6-3c1.5-1.5 1.8-4.5 1.8-4.5S7 13 5.5 11.5C3 9 2 2 2 2s7 1 9.5 3.5C13 8 12 14 12 14s3 0 4.5 1.5C18 17 22 22 22 22H2z" fill="white" opacity="0.9"/>
            </svg>
            <span>Explore Store</span>
            <svg class="arrow" width="12" height="12" viewBox="0 0 24 24" fill="none" aria-hidden>
              <path d="M5 12h14M13 5l7 7-7 7" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>

          <div class="trust">
            <div class="trust-item"><svg class="icon" viewBox="0 0 24 24"><path d="M12 2l3 5 6 1-4 4 1 6-6-3-6 3 1-6-4-4 6-1z" fill="#58a6ff"/></svg><span>Secure Payments</span></div>
            <div class="trust-item"><svg class="icon" viewBox="0 0 24 24"><path d="M3 12h3l3 6 6-12h4" stroke="#58a6ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg><span>Fast Delivery</span></div>
            <div class="trust-item"><svg class="icon" viewBox="0 0 24 24"><path d="M12 2l3 5 6 1-4 4 1 6-6-3-6 3 1-6-4-4 6-1z" fill="#58a6ff"/></svg><span>Genuine Products</span></div>
          </div>

          <div class="loading">
            <div class="loading-text">Loading...</div>
            <div class="dots"><span></span><span></span><span></span></div>
          </div>

          <div class="footer">
            <div class="version">Version 1.0.0</div>
            <div class="copyright">© 2026 ITECH-STORE. All rights reserved.</div>
          </div>
        </div>
      </div>
    </main>

    <script src="splash.js"></script>
  </body>
</html>
